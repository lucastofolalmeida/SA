<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sigin</title>

    <link rel="stylesheet" href="../styles/Login.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <main class="container">
      <h1>Login:</h1>

      <form id="form-cadastro">
        <div class="input-box">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="nome" placeholder="Enter name" />
        </div>

        <div class="input-box senha-box">
          <i class="fa-solid fa-lock"></i>

          <input type="password" id="senha" placeholder="Password" />

          <i class="fa-regular fa-eye olho" id="olhoSenha"></i>
        </div>

        <button type="submit">Login</button>

        <p id="mensagem"></p>
        <p id="validacao"></p>
      </form>

      <div class="login">
        <p>
          Não tem uma conta?
          <a href="sigin.html"> <em>create your account</em></a>
        </p>
      </div>
    </main>

    <script>
      const form = document.getElementById("form-cadastro");
      const mensagem = document.getElementById("mensagem");
      const validacao = document.getElementById("validacao");

      const olhoSenha = document.getElementById("olhoSenha");
      const olhoConfirmar = document.getElementById("olhoConfirmar");

      const senha = document.getElementById("senha");
      const confirmarSenha = document.getElementById("confirmarSenha");

      olhoSenha.addEventListener("click", () => {
        senha.type = senha.type === "password" ? "text" : "password";
      });

      olhoConfirmar.addEventListener("click", () => {
        confirmarSenha.type =
          confirmarSenha.type === "password" ? "text" : "password";
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const nome = document.getElementById("nome").value.trim();
        const senhaValor = senha.value.trim();

        mensagem.textContent = "";
        validacao.textContent = "";

        if (nome === "") {
          mensagem.textContent = "Preencha o nome.";
          return;
        }

        if (senhaValor.length < 6) {
          mensagem.textContent = "A senha deve ter pelo menos 6 caracteres.";
          return;
        }

        validacao.textContent = "Formulário validado com sucesso.";
      });
    </script>
  </body>
</html>
