<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>formulário</title>
    <link rel="stylesheet" href="../styles/sigin.css" />
  </head>

  <body>
    <main>
      <h1>Create your account</h1>

      <form id="form-inspecao">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" />

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" />

        <label for="setor">Setor</label>
        <select id="setor" name="setor">
          <option value="">Selecione...</option>
          <option value="operacao">Operação</option>
          <option value="manutencao">Manutenção</option>
          <option value="seguranca">Segurança</option>
        </select>

        <p>Prioridade</p>

        <label
          ><input type="radio" name="prioridade" value="baixa" />Baixa</label
        >
        <label
          ><input type="radio" name="prioridade" value="media" />Média</label
        >
        <label><input type="radio" name="prioridade" value="alta" />Alta</label>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao"> </textarea>

        <label for=""
          ><input type="checkbox" id="termos" name="termos" />Confirmo que
          revisei os dados</label
        >

        <button type="submit">Enviar</button>

        <p id="mensagem"></p>
        <p id="validacao"></p>
      </form>
    </main>

    <script>
      const form = document.getElementById("form-inspecao");
      const mensagem = document.getElementById("mensagem");
      const validacao = document.getElementById("validacao");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const nome = document.getElementById("nome").value.trim();
        const email = document.getElementById("email").value.trim();
        const setor = document.getElementById("setor").value;
        const descricao = document.getElementById("descricao").value.trim();
        const prioridade = document.querySelector(
          'input[name = "prioridade"]:checked',
        );
        const termos = document.getElementById("termos").checked;

        if (nome === "") {
          mensagem.textContent = "preencha o nome.";
          return;
        }

        if (email === "") {
          mensagem.textContent = "preencha o e-mail.";
          return;
        }

        if (setor === "") {
          mensagem.textContent = "preencha o setor.";
          return;
        }

        if (!prioridade) {
          mensagem.textContent = "selecione uma prioridade.";
          return;
        }

        if (descricao.length < 10) {
          mensagem.textContent =
            "A descrição deve ter pelo menos 10 caracteres";
          return;
        }

        if (!termos) {
          mensagem.textContent = "Marque a confirmação dos dados.";
          return;
        }
        mensagem.remove();
        validacao.textContent = "fomulário validado com sucesso.";
      });
    </script>
  </body>
</html>
